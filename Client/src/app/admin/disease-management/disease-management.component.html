<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Disease Management</h2>
            <p class="text-muted mb-0">Manage the disease list used for diagnosis and medicine suggestions.</p>
        </div>
        <button class="btn btn-success" (click)="openAddModal()">
            <i class="bi bi-plus-lg me-1"></i>Add Disease
        </button>
    </div>

    <div class="card border-0 shadow-sm position-relative" style="min-height: 200px;">
        <div class="card-header bg-white border-0 pt-3">
            <input type="text" class="form-control" style="max-width: 320px;" placeholder="Search diseases..."
                [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()">
        </div>
        <div class="card-body p-0">
            <ngx-spinner name="disease-list-spinner" [fullScreen]="false" bdColor="rgba(255,255,255,0.7)" 
                         size="medium" color="#1b5e3f" type="ball-clip-rotate">
            </ngx-spinner>

            <table class="table align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 80px;">Image</th>
                        <th>Name</th>
                        <th class="text-end" style="width: 160px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    @for (disease of pagedDiseases; track disease.id) {
                        <tr>
                            <td>
                                <img [src]="baseUrl + disease.imageUrl" [alt]="disease.name"
                                     class="rounded" style="width: 48px; height: 48px; object-fit: cover;">
                            </td>
                            <td>{{ disease.name }}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-success me-2" (click)="openEditModal(disease)">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" (click)="deleteDisease(disease)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    } @empty {
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">No diseases added yet.</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
         <!-- Pagination -->
        <div class="card-footer bg-white border-0 pt-3 pb-3">
            <app-pagination
                [totalItems]="filteredDiseases.length"
                [pageSize]="pageSize"
                [currentPage]="currentPage"
                (pageChange)="onPageChange($event)">
            </app-pagination>
        </div>
    </div>
</div>
