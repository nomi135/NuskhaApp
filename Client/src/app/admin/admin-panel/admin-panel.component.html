<div class="d-flex flex-column justify-content-center align-items-center hero">

        <div class="tab-panel">
            <tabset class="member-tabset" #adminTabs>
                <tab heading="Disease Management" (selectTab)="onTabActivated($event)">
                    <div class="container">
                        <app-disease-management></app-disease-management>
                    </div>
                </tab>
                <tab heading="Symptoms Management" (selectTab)="onTabActivated($event)">
                    <div class="container">
                        <!-- Load only when active for first time -->
                        <ng-container *ngIf="activeTab?.heading === 'Symptoms Management'">
                            <!-- <app-symptoms-management></app-symptoms-management> -->
                        </ng-container>
                    </div>
                </tab>
            </tabset>
        </div>
    </div>
</div>
