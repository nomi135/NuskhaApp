<div class="modal-header">
    <h5 class="modal-title">{{ isEditMode ? 'Edit Doctor' : 'Add Doctor' }}</h5>
    <button type="button" class="btn-close" (click)="cancel()" aria-label="Close"></button>
</div>

<div class="modal-body">
    <ngx-spinner name="doctor-form-spinner" [fullScreen]="false" bdColor="rgba(255,255,255,0.7)"
                 size="medium" color="#1b5e3f" type="ball-clip-rotate">
    </ngx-spinner>
    <form [formGroup]="doctorForm" (ngSubmit)="save()" novalidate>
        <div class="mb-3">
            <label class="form-label">Name <span class="text-danger">*</span></label>
            <app-text-input
                [formControl]="$any(doctorForm.controls['name'])"
                [label]="'Name'">
            </app-text-input>
        </div>
         <div class="mb-3 form-check form-switch">
            <input type="checkbox" class="form-check-input" id="isGlobal" formControlName="isGlobal">
            <label class="form-check-label" for="isGlobal">Global (available in all countries)</label>
        </div>

        <div class="mb-3">
            <label class="form-label">Countries</label>
            <div class="dropdown" dropdown [autoClose]="false" [isDisabled]="isGlobal">
                <button type="button" class="btn btn-outline-secondary dropdown-toggle w-100 text-start text-truncate"
                        [disabled]="isGlobal"
                        dropdownToggle>
                    {{ isGlobal ? 'Not applicable — doctor is Global' : selectedCountryNames }}
                </button>
                <div *dropdownMenu class="dropdown-menu w-100 p-2" style="max-height: 240px; overflow-y: auto;">
                    <input type="text" class="form-control form-control-sm mb-2" placeholder="Search countries..."
                           [(ngModel)]="countrySearchTerm" [ngModelOptions]="{standalone: true}"
                           (click)="$event.stopPropagation()">
                    <ul class="list-unstyled mb-0">
                        @for (country of filteredCountries; track country.id) {
                            <li>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" [id]="'country-' + country.id"
                                           [checked]="isCountrySelected(country.id)"
                                           (change)="toggleCountry(country.id)">
                                    <label class="form-check-label" [for]="'country-' + country.id">
                                        {{ country.name }}
                                    </label>
                                </div>
                            </li>
                        } @empty {
                            <li class="text-muted small px-2">No countries match "{{ countrySearchTerm }}".</li>
                        }
                    </ul>
                </div>
            </div>
            @if (!isGlobal) {
                <div class="form-text">Select the countries this doctor is relevant to.</div>
            }
        </div>

        <div class="modal-footer px-0 pb-0">
            <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
            <button type="submit" class="btn btn-success" [disabled]="isSubmitting">
                @if (isSubmitting) {
                    <span class="spinner-border spinner-border-sm me-1"></span>
                }
                Save
            </button>
        </div>
    </form>
</div>
