<div class="login-page d-flex align-items-stretch min-vh-100">
  <div class="row g-0 flex-grow-1 w-100">

    <!-- Brand panel (hidden on small screens) -->
    <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center text-white brand-panel p-5">
        <h2 class="fw-bold mb-3 text-center">Welcome back to Nuskha</h2>
        <p class="text-center col-lg-9 mb-0">
            Identify symptoms, diagnose conditions, and prescribe the right homeopathic
            medicine — faster and smarter, backed by clinical intelligence built for doctors.
        </p>
        <div class="brand-decor mt-5">
            <i class="bi bi-flower1"></i>
        </div>
    </div>

    <!-- Form panel -->
    <div class="col-lg-6 d-flex flex-column justify-content-center align-items-center bg-white p-4 p-md-5">
      <div class="w-100" style="max-width: 420px;" data-aos="fade-up">

        <div class="mb-4">
          <h2 class="fw-bold mb-1">Login</h2>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form" autocomplete="off">
          <ngx-spinner type="line-scale-party" [fullScreen]="true"></ngx-spinner>
          <div class="mb-3">
            <app-text-input
                [formControl]="$any(loginForm.controls['username'])"
                [label]="'Username'">
            </app-text-input>
          </div>

          <div class="mb-4">
            <app-text-input
                [formControl]="$any(loginForm.controls['password'])"
                [label]="'Password'"
                [type]="'password'">
            </app-text-input>
          </div>

          <button [disabled]="!loginForm.valid" class="btn btn-success w-100 py-2" type="submit">
            Login
          </button>
        </form>

      </div>
    </div>

  </div>
</div>
