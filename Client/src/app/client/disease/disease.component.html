<div class="container py-5">
    <ngx-spinner name="disease-spinner" [fullScreen]="false" bdColor="rgba(255,255,255,0.7)" 
                 size="medium" color="#1b5e3f" type="ball-clip-rotate">
    </ngx-spinner>
    <div class="text-center mb-4" data-aos="fade-up">
        <h2 class="fw-bold mb-2">Diseases</h2>
        <p class="text-muted mb-0">Browse diseases and jump straight into their related symptoms.</p>
    </div>

    <div class="row justify-content-center mb-4">
        <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Search diseases..."
                   [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()">
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-4">
        @for (disease of pagedDiseases; track disease.id) {
            <div class="col">
                <div class="disease-card card h-100 border-0 shadow-sm">
                <img [src]="baseUrl + disease.imageUrl" [alt]="disease.name"
                    class="card-img-top" style="height: 220px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h4 class="card-title mb-3 text-dark">{{ disease.name }}</h4>
                    <a [routerLink]="['/symptom']" [queryParams]="{ diseaseId: disease.id }" 
                    (click)="$event.stopPropagation()" 
                    class="btn btn-outline-success btn-sm mt-auto align-self-start">
                        <i class="bi bi-list-check me-1"></i>View Related Symptoms
                    </a>
                </div>
            </div>
            </div>
        } @empty {
            <div class="col-12">
                <p class="text-center text-muted py-5">No diseases match "{{ searchTerm }}".</p>
            </div>
        }
    </div>

    @if (filteredDiseases.length > pageSize) {
        <div class="d-flex justify-content-center mt-4">
            <app-pagination
                [totalItems]="filteredDiseases.length"
                [pageSize]="pageSize"
                [currentPage]="currentPage"
                (pageChange)="onPageChange($event)">
            </app-pagination>
        </div>
    }
</div>
