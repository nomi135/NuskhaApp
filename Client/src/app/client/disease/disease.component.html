<div class="container py-5 position-relative">
    <ngx-spinner name="disease-spinner" [fullScreen]="false" bdColor="rgba(255,255,255,0.7)"
                 size="medium" color="#1b5e3f" type="ball-clip-rotate">
    </ngx-spinner>

    <div class="text-center mb-4" data-aos="fade-up">
        <h2 class="fw-bold mb-2">Diseases</h2>
        <p class="text-muted mb-0">Browse diseases and jump straight into their related symptoms.</p>
    </div>

    <div class="row justify-content-center mb-4">
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" class="form-control border-start-0 ps-0" placeholder="Search diseases..."
                       [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()">
            </div>
        </div>
    </div>

    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3">
        @for (disease of visibleDiseases; track disease.id) {
            <div class="col">
                <div class="disease-card card h-100 border-0 shadow-sm" role="button" [routerLink]="['/symptom']" [queryParams]="{ diseaseId: disease.id }"
                        (click)="$event.stopPropagation()">
                    <div class="disease-img-wrapper">
                        <img [src]="baseUrl + disease.imageUrl" [alt]="disease.name" class="disease-img-bg" aria-hidden="true">
                        <img [src]="baseUrl + disease.imageUrl" [alt]="disease.name" class="disease-img-fg">
                    </div>
                     <div class="card-body d-flex flex-column p-2">
                        <h6 class="card-title mb-2 text-dark text-truncate">{{ disease.name }}</h6>
                        <a [routerLink]="['/symptom']" [queryParams]="{ diseaseId: disease.id }"
                        (click)="$event.stopPropagation()"
                        class="btn btn-outline-success btn-sm mt-auto align-self-start">
                            <i class="bi bi-list-check me-1"></i>Symptoms
                        </a>
                    </div>
                </div>
            </div>
        } @empty {
            <div class="col-12">
                <p class="text-center text-muted py-5">No diseases match "{{ searchTerm }}".</p>
            </div>
        }
    </div>

    @if (hasMore) {
        <div appInfiniteScroll (scrolled)="loadMore()" class="text-center py-4">
            <div class="spinner-border spinner-border-sm text-success" role="status">
                <span class="visually-hidden">Loading more...</span>
            </div>
        </div>
    }
</div>
